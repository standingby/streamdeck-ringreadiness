name: Feature request
description: Suggest a metric, a layout or a new way to use the keys and dials.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to see?
      description: The metric or behaviour, and how you would use it day to day.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [New metric, Key layout, Dial layout, Settings, Other]
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried instead?
